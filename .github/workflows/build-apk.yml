name: Android APK Derle
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Getir
        uses: actions/checkout@v4

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları Kur
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Web Kodunu Derle
        run: npm run build

      - name: Android Projesini Hazırla
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Chroma Nocta" "com.chromanocta.app" --web-dir dist
          fi
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: APK Dosyasını Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını İndirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: ChromaNocta-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
